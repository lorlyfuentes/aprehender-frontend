<h1>Ejercicios</h1>

@if (esDocente) {
  <a class="boton boton-uva" routerLink="/ejercicios/nuevo">Nuevo ejercicio</a>
}

<section>
  @for (ejercicio of ejercicios(); track ejercicio._id) {
    <article>
      <h2>
        <a [routerLink]="['/ejercicios', ejercicio._id]">{{ ejercicio.titulo }}</a>
      </h2>
      <p>Nivel: {{ ejercicio.nivel }}</p>
      @if (ejercicio.esMuestra) {
        <p>Ejercicio de muestra</p>
      }
    </article>
  } @empty {
    <p>No hay ejercicios disponibles.</p>
  }
</section>
